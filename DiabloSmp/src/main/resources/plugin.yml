name: DiabloSmp
version: ${project.version}
main: com.twicefear.diablosmp.DiabloSmpPlugin
api-version: '1.21'
author: Twicefear
description: Ultimate Diablo Stones Plugin with 15 unique stones and complex abilities
website: https://github.com/Twicefear/DiabloSmp

prefix: DiabloSmp
load: STARTUP

commands:
  diablosmp:
    description: Main command for DiabloSmp plugin
    usage: /<command> [start|stop|changename|withdraw|reload|help|stats|list|give|remove]
    aliases: [ds, diablo]
  dstone:
    description: Stone management command
    usage: /<command> [absorb|info|cooldown]
    aliases: [stone, dstone]

permissions:
  diablosmp.admin:
    description: Full admin access to all commands
    default: op
    children:
      diablosmp.command.start: true
      diablosmp.command.stop: true
      diablosmp.command.changename: true
      diablosmp.command.withdraw: true
      diablosmp.command.reload: true
      diablosmp.command.give: true
      diablosmp.command.remove: true
      diablosmp.use: true
  diablosmp.player:
    description: Basic player permissions
    default: true
    children:
      diablosmp.use: true
      diablosmp.command.help: true
      diablosmp.command.stats: true
      diablosmp.command.list: true
      diablosmp.command.withdraw: true
