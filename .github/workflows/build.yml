name: Build DiabloSMP

on:
  push:
    branches: [ Sarvam, main, master ]
  pull_request:
    branches: [ Sarvam, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean compile 2>&1 | tee /tmp/maven-output.txt
        continue-on-error: true

      - name: Show compilation errors
        if: always()
        run: |
          echo "=== Maven Output ==="
          cat /tmp/maven-output.txt
          echo "=== End ==="

      - name: Build package
        run: mvn -B package -DskipTests

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiabloSMP-plugin
          path: target/DiabloSMP-*.jar
          if-no-files-found: error

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: DiabloSMP-resourcepack
          path: resourcepack/
          if-no-files-found: warn
