name: Build DiabloSMP Plugin

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DiabloSMP-Plugin
        path: build/libs/*.jar

    - name: Upload Resource Pack Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DiabloSMP-ResourcePack
        path: DiabloSMP-ResourcePack.zip
