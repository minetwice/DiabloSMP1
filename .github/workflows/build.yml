name: Build Plugin

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        id: gradle-build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-output.log

      - name: Post error as commit comment
        if: steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/gradle-output.log', 'utf8');
            const lines = output.split("\n").slice(-200).join("\n");
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: "## Build Failed - Gradle Output (last 200 lines)\n```\n" + lines + "\n```"
            });
            core.setFailed("Build failed - see comment above for error details");

      - name: Upload JAR artifact
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ElementalCoreWeaponSystem
          path: build/libs/*.jar
          if-no-files-found: error
