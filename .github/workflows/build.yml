name: Build Plugin

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        id: gradle-build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-output.log

      - name: Post error as commit comment
        if: steps.gradle-build.outcome == 'failure'
        run: |
          tail -200 /tmp/gradle-output.log > /tmp/error-output.txt
          jq -n --rawfile body /tmp/error-output.txt '{body: "## Build Failed - Gradle Output (last 200 lines)\n```\n\(.body)\n```"}' > /tmp/comment.json
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/comment.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
          exit 1

      - name: Upload JAR artifact
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ElementalCoreWeaponSystem
          path: build/libs/*.jar
          if-no-files-found: error
