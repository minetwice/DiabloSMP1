name: Build DiabloSMP

on:
  push:
    branches: [ Sarvam, main, master ]
  pull_request:
    branches: [ Sarvam, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and show errors
        run: |
          mvn -B clean compile 2>&1 | tee /tmp/maven-output.txt
          if grep -q "BUILD FAILURE" /tmp/maven-output.txt; then
            echo "::error::Maven compilation failed. Extracting errors..."
            grep -E "^\[ERROR\]" /tmp/maven-output.txt | head -50 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Build package
        run: mvn -B package -DskipTests

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiabloSMP-plugin
          path: target/DiabloSMP-*.jar
          if-no-files-found: error

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: DiabloSMP-resourcepack
          path: resourcepack/
          if-no-files-found: warn
