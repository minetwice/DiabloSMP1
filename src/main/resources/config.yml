        max-targets: 12
      custom-model-data: 1004
      material: VINE
      sounds:
        cast: BLOCK_AZALEA_LEAVES_BREAK
        charge: ENTITY_PLAYER_ATTACK_CRIT
        impact: BLOCK_GRASS_BREAK

    VOID:
