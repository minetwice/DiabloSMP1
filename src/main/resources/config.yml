plugin:
  prefix: "<gradient:#FF5555:#AA0000>DiabloSMP</gradient> <gray>»</gray> "
  debug: false
  check-updates: false

settings:
  enabled-worlds: []
  blacklist-mode: false
  allow-cast-in-creative: false
  allow-cast-in-spectator: false
  friendly-fire: false
  protect-caster-fall-damage: true
  max-concurrent-casts-per-player: 1
  global-cast-limit: 80

casting:
  right-click-enabled: true
  allow-empty-hand: true
  allow-any-item: false
  sneak-right-click-open-menu: true
  blocked-materials:
    - CHEST
    - ENDER_CHEST
    - FURNACE
    - HOPPER
    - BARREL
    - CRAFTING_TABLE
    - ANVIL
    - LEVER
    - STONE_BUTTON
    - OAK_BUTTON
    - DARK_OAK_BUTTON
    - SPRUCE_BUTTON
    - BIRCH_BUTTON
    - JUNGLE_BUTTON
    - ACACIA_BUTTON
    - MANGROVE_BUTTON
    - CHERRY_BUTTON
    - BAMBOO_BUTTON
    - CRIMSON_BUTTON
    - WARPED_BUTTON
    - POLISHED_BLACKSTONE_BUTTON

hud:
  enabled: true
  update-interval-ticks: 4
  use-resource-pack-hud: true
  fallback-actionbar: true
  show-all-cooldowns: false
  priority: ACTIVE_THEN_LONGEST
  no-stone-text: "<gray>No Diablo Stone</gray>"
  ready-text: "<red>READY</red>"
  cooldown-format: "<color:#FF5555>{stone}</color> <color:#AAAAAA>{bar}</color> {seconds}s"

first-join:
  enabled: true
  mode: CHOOSE_ONE # CHOOSE_ONE, RANDOM_ONE, NONE
  broadcast: false
  message: "<gradient:#FF5555:#AA0000>Welcome to DiabloSMP. Choose your first Diablo Stone.</gradient>"

targeting:
  players: true
  hostile-mobs: true
  neutral-mobs: false
  passive-mobs: false
  armor-stands: false
  display-entities: false
  ignore-creative: true
  ignore-spectator: true
  ignore-npcs: true
  max-targets-hard-cap: 60

damage:
  use-custom-death-messages: true
  pvp-check: true
  mob-damage: true
  self-damage: false
  knockback-multiplier: 1.0
  invulnerability-ticks: 10

performance:
  particle-quality: HIGH
  max-display-entities-per-cast: 40
  display-entity-lifetime-ticks: 200
  cleanup-interval-ticks: 100

storage:
  type: FLATFILE # FLATFILE or SQLITE
  save-interval-seconds: 300

stones:
  item-mode: false
  soulbound: true
  prevent-drop: true
  prevent-trade: true
  prevent-container: true
  types:
    SHARD:
      enabled: true
      display-name: "<color:#55FFFF>Diablo Shard</color>"
      description:
        - "<gray>Summon 5 corrupted azure shards,"
        - "<gray>lock enemies in front, then smash them.</gray>"
      cooldown-seconds: 18
      damage:
        direct: 14.0
        fallback-aoe: 8.0
      targeting:
        shape: CONE
        radius: 12.0
        angle: 90
        max-targets: 8
      custom-model-data: 1001
      material: AMETHYST_SHARD
      sounds:
        cast: ENTITY_ENDER_DRAGON_FLAP
        charge: BLOCK_AMETHYST_CHIME
        impact: ENTITY_GENERIC_EXPLODE

    EMBER:
      enabled: true
      display-name: "<color:#FF3300>Diablo Ember</color>"
      description:
        - "<gray>Form a hellfire crimson ring,"
        - "<gray>launch 6 meteor fangs onto enemies.</gray>"
      cooldown-seconds: 22
      damage:
        direct: 12.0
        fallback-aoe: 8.0
      targeting:
        shape: RADIUS
        radius: 8.0
        max-targets: 10
      custom-model-data: 1002
      material: FIRE_CHARGE
      sounds:
        cast: ITEM_FIRECHARGE_USE
        charge: BLOCK_FIRE_AMBIENT
        impact: ENTITY_DRAGON_FIREBALL_EXPLODE

    HALO:
      enabled: true
      display-name: "<color:#FFD700>Diablo Halo</color>"
      description:
        - "<gray>Rays of corrupted solar light radiate,</gray>"
        - "<gray>summoning holy pillars on target heads.</gray>"
      cooldown-seconds: 26
      damage:
        direct: 13.0
        fallback-aoe: 6.0
      targeting:
        shape: RADIUS
        radius: 9.0
        max-targets: 12
      custom-model-data: 1003
      material: NETHER_STAR
      sounds:
        cast: BLOCK_BEACON_ACTIVATE
        charge: BLOCK_BELL_RESONATE
        impact: ENTITY_LIGHTNING_BOLT_THUNDER

    ROOT:
      enabled: true
      display-name: "<color:#55FF55>Diablo Root</color>"
      description:
        - "<gray>Corrupted nature vines trap enemies,</gray>"
        - "<gray>immobilizing them before a leaf storm burst.</gray>"
      cooldown-seconds: 24
      damage:
