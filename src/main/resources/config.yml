# DiabloSMP Configuration File
# Author: Twicefear

# SMP Settings
smp:
  default-name: "DiabloSMP"
  grace-period:
    default-minutes: 5
    default-seconds: 0
  world-border:
    initial-size: 20
    final-size: 20000
    # Use -1 for infinite border
    infinite: false
  announcements:
    enabled: true
    countdown-seconds: 10
    messages:
      - "&c&lTHE GRACE PERIOD IS ENDING!"
      - "&e&lDIABLOSMP BEGINS NOW!"
      - "&6&lMAY THE BEST WINNER WIN!"

# Stone Settings
stones:
  drop-on-death: false
  prevent-drop: true
  prevent-storage: false
  absorb-animation-duration: 80 # ticks (4 seconds)

# Cooldown Settings
cooldown:
  show-actionbar: true
  ready-message: "\uE001 &aAbility Ready!"
  bar-style: "ACTION_BAR" # ACTION_BAR, BOSSBAR, CHAT

# Particle Settings
particles:
  join-reward:
    enabled: true
    duration-ticks: 160 # 8 seconds
    types:
      - SPELL_MOB
      - PORTAL
      - DRAGON_BREATH
  ability-effects:
    high-quality: true
    max-particles: 5000

# Ability Balance (Cooldown in seconds)
abilities:
  earthquake:
    primary-cooldown: 120
    secondary-cooldown: 300
  inferno:
    primary-cooldown: 90
    secondary-cooldown: 180
  frostbite:
