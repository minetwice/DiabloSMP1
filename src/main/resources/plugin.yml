name: ElementalCoreWeaponSystem
version: ${version}
main: com.sdmine.elementalcore.ElementalCorePlugin
api-version: '1.20'
author: SD MINE
description: Elemental Core Weapon System — modular socket-based elemental weapons inspired by Tensura.
softdepend: [ExecutableItems, SCore]
commands:
  elemental:
    description: Main command for the Elemental Core Weapon System.
    usage: /elemental <socket|reload|givecore|giveblade>
    permission: elementalcore.use
    aliases: [ecw, elem]
permissions:
  elementalcore.use:
    description: Allows use of basic Elemental Core commands.
    default: true
  elementalcore.admin:
    description: Allows admin commands (reload, give items).
    default: op
