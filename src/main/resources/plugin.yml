name: DiabloSMP
version: '${project.version}'
main: com.twicefear.diablosmp.DiabloSMP
api-version: '1.21'
author: Twicefear
description: Custom Abilities Plugin powered by Aethelion Engine
depend: [Aethelion]
softdepend: []

commands:
  ability:
    description: Give yourself an ability item
    usage: /ability give <name>
    permission: diablosmp.ability.give
  abilities:
    description: List all available abilities
    usage: /abilities
    permission: diablosmp.ability.list

permissions:
  diablosmp.ability.give:
    description: Allows giving ability items
    default: op
  diablosmp.ability.list:
    description: Allows listing abilities
    default: true
  diablosmp.ability.use:
    description: Allows using abilities
    default: true
